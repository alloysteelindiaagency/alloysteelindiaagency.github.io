<!DOCTYPE html>

<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; }
  .india-outline { fill: #cfe0ee; stroke: #2c455d; stroke-width: 1; }
  .route-line { fill: none; stroke: #2c455d; stroke-width: 1; stroke-dasharray: 3 3; opacity: 0.4; }
  .city-dot { fill: #ffffff; stroke: #2c455d; stroke-width: 1.5; cursor: pointer; transition: r 0.15s ease; }
  .city-dot.origin { fill: #1d2d3d; }
  .city-dot.lit { fill: #f5a623; filter: url(#glow); }
  .city-dot:hover, .city-dot.hovered { fill: #f5a623; filter: url(#glow); }
  .city-label { font-family: Barlow, sans-serif; font-size: 9px; fill: #1d1f20; pointer-events: none; }
  .city-label.origin-label { font-weight: 700; }
  .city-label.hovered { font-size: 12px; font-weight: 700; }
  .pulse-dot { fill: #f5d76e; filter: url(#glow); }
  .pulse-core { fill: #ffffff; }

.098,201.513L514.216,198.681L532.35,181.818L555.449,167.28L572.215,172.897L586.463,163.243L595.817,177.458L589.053,187.016Z"></path>

<script>
(function () {
  // Precomputed India outline + city positions (baked in at build time from
  // vendor/countries-110m.json via d3-geo, so the map renders immediately
  // from static markup above with no runtime fetch/library dependency —
  // this avoids the map appearing blank on a slow/first-time page load).
  var svg = document.getElementById('stage');
  var originXY = { x: 121.91, y: 391.19 };
  var CITIES = [{"name": "Pune", "x": 141.47, "y": 402.93}, {"name": "Ahmedabad", "x": 115.78, "y": 306.65}, {"name": "Vapi", "x": 122.45, "y": 363.69}, {"name": "Indore", "x": 181.47, "y": 313.22}, {"name": "Rajkot", "x": 80.42, "y": 322.21}, {"name": "Silvassa", "x": 124.27, "y": 365.77}, {"name": "Delhi NCR", "x": 206.35, "y": 180.37}, {"name": "Gurugram", "x": 204.83, "y": 185.93}, {"name": "Ludhiana", "x": 181.46, "y": 129.76}, {"name": "Bengaluru", "x": 216.19, "y": 518.21}, {"name": "Coimbatore", "x": 203.42, "y": 558.16}, {"name": "Kolkata", "x": 431.45, "y": 316.4}, {"name": "Kochi", "x": 189.66, "y": 580.23}, {"name": "Bhubaneswar", "x": 380.69, "y": 365.29}];
  var started = false;

  var cityLayer = document.getElementById('city-layer');
  var pulseLayer = document.getElementById('pulse-layer');

  CITIES.forEach(function (c) {
    var g = cityLayer.querySelector('g[data-name="' + c.name.replace(/"/g, '\\"') + '"]');
    if (!g) return;
    var dot = g.querySelector('.city-dot');
    var label = g.querySelector('.city-label');
    c.dot = dot;
    c.label = label;
    dot.addEventListener('mouseenter', function () {
      dot.setAttribute('r', 7);
      label.classList.add('hovered');
    });
    dot.addEventListener('mouseleave', function () {
      dot.setAttribute('r', 3.5);
      label.classList.remove('hovered');
    });
  });

  function lerp(a, b, t) { return a + (b - a) * t; }

  function animateRoute(i) {
    if (i >= CITIES.length) return;
    var c = CITIES[i];
    var dur = 520;
    var start = null;

    var ns = 'http://www.w3.org/2000/svg';
    var group = document.createElementNS(ns, 'g');
    var glow = document.createElementNS(ns, 'circle');
    glow.setAttribute('class', 'pulse-dot');
    glow.setAttribute('r', 4.5);
    glow.setAttribute('cx', originXY.x);
    glow.setAttribute('cy', originXY.y);
    var core = document.createElementNS(ns, 'circle');
    core.setAttribute('class', 'pulse-core');
    core.setAttribute('r', 1.8);
    core.setAttribute('cx', originXY.x);
    core.setAttribute('cy', originXY.y);
    group.appendChild(glow);
    group.appendChild(core);
    pulseLayer.appendChild(group);

    function step(ts) {
      if (start === null) start = ts;
      var t = Math.min(1, (ts - start) / dur);
      var x = lerp(originXY.x, c.x, t);
      var y = lerp(originXY.y, c.y, t);
      glow.setAttribute('cx', x); glow.setAttribute('cy', y);
      core.setAttribute('cx', x); core.setAttribute('cy', y);
      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        pulseLayer.removeChild(group);
        if (c.dot) c.dot.classList.add('lit');
        setTimeout(function () { animateRoute(i + 1); }, 50);
      }
    }
    requestAnimationFrame(step);
  }

  function startAnimation() {
    if (started) return;
    started = true;
    animateRoute(0);
  }

  // Preferred trigger: parent page tells us when the map has scrolled into view.
  window.addEventListener('message', function (e) {
    if (e.data === 'play') startAnimation();
  });

  // Fallback: if no 'play' message arrives shortly after load (e.g. the map
  // was already in view before the parent's listener attached, or the
  // message was missed), start the animation anyway so it never gets stuck.
  setTimeout(startAnimation, 1200);
})();
</script>
